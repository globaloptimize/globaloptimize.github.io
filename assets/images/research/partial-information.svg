<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Partial &amp; human information</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Decide what to observe, query, share, or infer when the state and objective are only partially revealed.</text><g filter="url(#shadow)"><rect x="70" y="155" width="300" height="375" rx="28" fill="#fff" stroke="#d7e4f2"/><text x="220" y="205" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#071b35">Hidden world</text><circle cx="135" cy="275" r="26" fill="#005bbb" opacity=".18"/><circle cx="135" cy="275" r="10" fill="#005bbb"/><circle cx="220" cy="330" r="26" fill="#006570" opacity=".18"/><circle cx="220" cy="330" r="10" fill="#006570"/><circle cx="305" cy="255" r="26" fill="#b36b00" opacity=".18"/><circle cx="305" cy="255" r="10" fill="#b36b00"/><circle cx="290" cy="430" r="26" fill="#2f9fd0" opacity=".18"/><circle cx="290" cy="430" r="10" fill="#2f9fd0"/><circle cx="150" cy="440" r="26" fill="#a61b34" opacity=".18"/><circle cx="150" cy="440" r="10" fill="#a61b34"/><path d="M105 245 C180 185 270 205 340 250 L340 470 C250 510 160 500 105 445 Z" fill="#d7e7f6" opacity=".48"/></g><g><rect x="410" y="198" width="165" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="492.5" y="225" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#071b35">partial state</text></g><path d="M575 220 C615 220 625 220 665 220" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="410" y="293" width="165" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="492.5" y="320" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#071b35">preference</text></g><path d="M575 315 C615 315 625 315 665 315" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="410" y="388" width="165" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="492.5" y="415" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#071b35">active probe</text></g><path d="M575 410 C615 410 625 410 665 410" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="670" y="155" width="460" height="375" rx="28" fill="#fff" stroke="#d7e4f2"/><text x="900" y="205" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#071b35">Information-aware decision</text><g filter="url(#shadow)"><rect x="710" y="235" width="180" height="120" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="710" y="235" width="8" height="120" rx="4" fill="#2f9fd0"/><text x="738" y="277" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Infer</text><text x="738" y="313" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="738" dy="0">belief / latent state</tspan><tspan x="738" dy="22.44">confidence &amp; sharing</tspan></text></g><g filter="url(#shadow)"><rect x="920" y="235" width="170" height="120" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="920" y="235" width="8" height="120" rx="4" fill="#b36b00"/><text x="948" y="277" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Ask</text><text x="948" y="313" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="948" dy="0">query value</tspan><tspan x="948" dy="22.44">probe then commit</tspan></text></g><g filter="url(#shadow)"><rect x="710" y="390" width="180" height="110" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="710" y="390" width="8" height="110" rx="4" fill="#005bbb"/><text x="738" y="432" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Act</text><text x="738" y="468" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="738" dy="0">policy / arm / route</tspan><tspan x="738" dy="22.44">personalized objective</tspan></text></g><g filter="url(#shadow)"><rect x="920" y="390" width="170" height="110" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="920" y="390" width="8" height="110" rx="4" fill="#087f5b"/><text x="948" y="432" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Prove</text><text x="948" y="468" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="948" dy="0">regret &amp; lower bounds</tspan><tspan x="948" dy="22.44">information limits</tspan></text></g></g><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#071b35">Applications: POMDP control · RLHF · conversational learning · sensing · quantum probing</text></svg>