<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Safe and verifiable learning illustration</title><desc id="desc">Academic research illustration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#005bbb"/><stop offset="1" stop-color="#006570"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071b35" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#005bbb"/></marker>
</defs>
<rect width="1200" height="720" rx="38" fill="url(#bg)"/>
<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Safe &amp; verifiable learning</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Learn useful behavior while every action, transition, and joint decision remains certifiably safe.</text><circle cx="155" cy="245" r="33" fill="#005bbb" opacity=".16"/><circle cx="155" cy="245" r="16" fill="#005bbb"/><circle cx="285" cy="185" r="33" fill="#2f9fd0" opacity=".16"/><circle cx="285" cy="185" r="16" fill="#2f9fd0"/><circle cx="330" cy="315" r="33" fill="#006570" opacity=".16"/><circle cx="330" cy="315" r="16" fill="#006570"/><line x1="155" y1="245" x2="285" y2="185" stroke="#a61b34" stroke-width="4" stroke-dasharray="9 8" opacity=".75"/><line x1="155" y1="245" x2="330" y2="315" stroke="#a61b34" stroke-width="4" stroke-dasharray="9 8" opacity=".75"/><line x1="285" y1="185" x2="330" y2="315" stroke="#a61b34" stroke-width="4" stroke-dasharray="9 8" opacity=".75"/><path d="M75 380 C165 300 245 400 395 260" fill="none" stroke="#087f5b" stroke-width="10" stroke-linecap="round"/><path d="M75 414 C170 330 255 445 410 295" fill="none" stroke="#a61b34" stroke-width="4" stroke-dasharray="12 10" opacity=".65"/><g><rect x="90" y="465" width="250" height="42" rx="21" fill="#fff7f8" stroke="#efbac6"/><text x="215.0" y="492" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#a61b34">local safe ≠ jointly safe</text></g><g filter="url(#shadow)"><rect x="470" y="155" width="300" height="160" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="470" y="155" width="8" height="160" rx="4" fill="#a61b34"/><text x="498" y="197" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Certificate</text><text x="498" y="233" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="498" dy="0">Pessimistic constraint bounds</tspan><tspan x="498" dy="22.44">coupled local scopes</tspan><tspan x="498" dy="22.44">recursive safe continuation</tspan></text></g><g filter="url(#shadow)"><rect x="830" y="155" width="300" height="160" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="830" y="155" width="8" height="160" rx="4" fill="#005bbb"/><text x="858" y="197" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Explore</text><text x="858" y="233" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="858" dy="0">Optimistic value learning</tspan><tspan x="858" dy="22.44">only inside the certified region</tspan><tspan x="858" dy="22.44">fallback to a safe seed</tspan></text></g><path d="M770 235 C790 235 805 235 825 235" fill="none" stroke="#005bbb" stroke-width="4" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="470" y="395" width="300" height="160" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="470" y="395" width="8" height="160" rx="4" fill="#006570"/><text x="498" y="437" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Structure</text><text x="498" y="473" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="498" dy="0">Factor graphs and message passing</tspan><tspan x="498" dy="22.44">avoid full joint enumeration</tspan><tspan x="498" dy="22.44">compose subsystem witnesses</tspan></text></g><g filter="url(#shadow)"><rect x="830" y="395" width="300" height="160" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="830" y="395" width="8" height="160" rx="4" fill="#087f5b"/><text x="858" y="437" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Guarantees</text><text x="858" y="473" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="858" dy="0">zero instantaneous violation</tspan><tspan x="858" dy="22.44">sublinear regret</tspan><tspan x="858" dy="22.44">certification complexity</tspan></text></g><path d="M770 475 C790 475 805 475 825 475" fill="none" stroke="#005bbb" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#071b35">Applications: multi-robot coordination · wireless interference · manufacturing · autonomous control</text></svg>