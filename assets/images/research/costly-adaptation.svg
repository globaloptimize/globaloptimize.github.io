<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Prediction &amp; costly adaptation</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Act online when moving, switching, refreshing, or reconfiguring has a real operational cost.</text><rect x="65" y="150" width="470" height="350" rx="24" fill="#fff" stroke="#d7e4f2" filter="url(#shadow)"/><line x1="100" y1="220" x2="500" y2="220" stroke="#dce6f1"/><line x1="100" y1="300" x2="500" y2="300" stroke="#dce6f1"/><line x1="100" y1="380" x2="500" y2="380" stroke="#dce6f1"/><line x1="100" y1="460" x2="500" y2="460" stroke="#dce6f1"/><polyline points="100,410 155,345 210,372 265,250 320,285 375,190 430,240 495,175" fill="none" stroke="#2f9fd0" stroke-width="5"/><polyline points="100,430 155,420 210,360 265,350 320,292 375,280 430,225 495,215" fill="none" stroke="#005bbb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="155" y1="490" x2="155" y2="180" stroke="#b36b00" stroke-width="3" stroke-dasharray="8 8" opacity=".65"/><line x1="265" y1="490" x2="265" y2="180" stroke="#b36b00" stroke-width="3" stroke-dasharray="8 8" opacity=".65"/><line x1="375" y1="490" x2="375" y2="180" stroke="#b36b00" stroke-width="3" stroke-dasharray="8 8" opacity=".65"/><line x1="495" y1="490" x2="495" y2="180" stroke="#b36b00" stroke-width="3" stroke-dasharray="8 8" opacity=".65"/><g><rect x="125" y="525" width="160" height="42" rx="21" fill="#eef8ff" stroke="#a8d8ef"/><text x="205.0" y="552" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#005bbb">demand / forecast</text></g><g><rect x="310" y="525" width="185" height="42" rx="21" fill="#eef6ff" stroke="#b5d0ec"/><text x="402.5" y="552" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#071b35">executed schedule</text></g><g filter="url(#shadow)"><rect x="590" y="155" width="540" height="150" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="590" y="155" width="8" height="150" rx="4" fill="#b36b00"/><text x="618" y="197" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Decision principle</text><text x="618" y="233" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="618" dy="0">current service cost + switching / ramp / refresh cost</tspan><tspan x="618" dy="22.44">use forecasts when certified; remain robust when they fail</tspan></text></g><g filter="url(#shadow)"><rect x="590" y="345" width="250" height="180" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="590" y="345" width="8" height="180" rx="4" fill="#005bbb"/><text x="618" y="387" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Techniques</text><text x="618" y="423" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="618" dy="0">regularization + lookahead</tspan><tspan x="618" dy="22.44">competitive analysis</tspan><tspan x="618" dy="22.44">variation/path-length budgets</tspan><tspan x="618" dy="22.44">bi-level learning</tspan></text></g><g filter="url(#shadow)"><rect x="880" y="345" width="250" height="180" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="880" y="345" width="8" height="180" rx="4" fill="#087f5b"/><text x="908" y="387" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Guarantees</text><text x="908" y="423" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="908" dy="0">competitive ratio</tspan><tspan x="908" dy="22.44">dynamic regret</tspan><tspan x="908" dy="22.44">best-of-both-worlds</tspan><tspan x="908" dy="22.44">reconfiguration bounds</tspan></text></g><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#071b35">Applications: data-center routing · NFV · edge model updates · fluid antennas · mobility-aware control</text></svg>