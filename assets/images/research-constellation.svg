<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="title desc">
  <title id="title">Research constellation</title>
  <desc id="desc">A visual map connecting uncertain observations, safe decisions, resource adaptation, learning feedback, and networked autonomous systems.</desc>
  <defs>
    <linearGradient id="panel" x1="70" y1="44" x2="845" y2="645" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#e8f5f6"/>
    </linearGradient>
    <linearGradient id="blue" x1="176" y1="113" x2="708" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#005bbb"/>
      <stop offset="1" stop-color="#2f9fd0"/>
    </linearGradient>
    <linearGradient id="green" x1="365" y1="222" x2="689" y2="509" gradientUnits="userSpaceOnUse">
      <stop stop-color="#006570"/>
      <stop offset="1" stop-color="#38a3a5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071b35" flood-opacity=".14"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m0 0 10 5-10 5Z" fill="#005bbb"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="884" height="654" rx="46" fill="url(#panel)" stroke="#005bbb" stroke-opacity=".12" stroke-width="2"/>
  <g opacity=".5" stroke="#005bbb" stroke-opacity=".13">
    <path d="M70 135h780M70 255h780M70 375h780M70 495h780"/>
    <path d="M155 72v546M310 72v546M465 72v546M620 72v546M775 72v546"/>
  </g>

  <path d="M170 199C280 88 423 109 491 205c63 88 178 36 252 137 78 106 2 235-100 251-96 15-141-77-231-42-105 40-225 21-280-78-54-98-24-209 38-274Z" fill="#005bbb" opacity=".055" stroke="#005bbb" stroke-opacity=".22" stroke-width="3" stroke-dasharray="11 10"/>
  <path d="M329 267c74-80 190-72 251 0 34 40 77 52 107 94 44 62 12 137-50 162-69 27-115-21-174-8-87 20-170-18-188-92-14-60 13-112 54-156Z" fill="#006570" opacity=".10" stroke="#006570" stroke-opacity=".55" stroke-width="3"/>

  <g fill="none" stroke="#005bbb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M177 227c74 13 115 41 157 91"/>
    <path d="M420 337c47-36 89-52 144-49"/>
    <path d="M626 310c49 22 76 58 86 105"/>
    <path d="M700 474c-51 74-144 90-217 54"/>
    <path d="M404 514c-97 17-183-38-204-129"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(101 163)">
      <rect width="187" height="104" rx="25" fill="#fff" stroke="#005bbb" stroke-opacity=".22"/>
      <circle cx="34" cy="35" r="13" fill="#2f9fd0" opacity=".24"/><circle cx="34" cy="35" r="6" fill="#005bbb"/>
      <text x="59" y="38" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Uncertainty</text>
      <text x="25" y="70" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="14">partial state · drift</text>
      <text x="25" y="90" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="14">adversaries · noise</text>
    </g>

    <g transform="translate(325 282)">
      <rect width="238" height="117" rx="27" fill="#fff" stroke="#006570" stroke-opacity=".28"/>
      <path d="M32 30h27v25c0 19-13 31-27 36C18 86 5 74 5 55V30l27-9 27 9" transform="translate(13 2)" fill="#006570" opacity=".15" stroke="#006570" stroke-width="3"/>
      <path d="m32 46 10 10 18-22" transform="translate(13 2)" fill="none" stroke="#006570" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="48" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Safe decisions</text>
      <text x="84" y="72" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="14">hard constraints</text>
      <text x="84" y="93" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="14">performance guarantees</text>
    </g>

    <g transform="translate(576 224)">
      <rect width="221" height="106" rx="25" fill="#fff" stroke="#005bbb" stroke-opacity=".22"/>
      <path d="M30 34h34M47 17v34M25 70h44" stroke="#005bbb" stroke-width="4" stroke-linecap="round"/>
      <circle cx="47" cy="34" r="9" fill="#2f9fd0"/>
      <circle cx="34" cy="70" r="8" fill="#006570"/>
      <text x="88" y="42" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Resource</text>
      <text x="88" y="65" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">adaptation</text>
      <text x="88" y="87" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="13">switching · sensing</text>
    </g>

    <g transform="translate(590 426)">
      <rect width="225" height="104" rx="25" fill="#fff" stroke="#005bbb" stroke-opacity=".22"/>
      <circle cx="33" cy="44" r="8" fill="#005bbb"/><circle cx="65" cy="29" r="8" fill="#2f9fd0"/><circle cx="68" cy="67" r="8" fill="#006570"/>
      <path d="m40 41 18-9M40 48l20 15M67 38l1 20" stroke="#005bbb" stroke-width="3"/>
      <text x="92" y="42" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Networked</text>
      <text x="92" y="66" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">autonomy</text>
      <text x="92" y="87" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="13">edge · multi-agent</text>
    </g>

    <g transform="translate(133 399)">
      <rect width="224" height="108" rx="25" fill="#fff" stroke="#005bbb" stroke-opacity=".22"/>
      <path d="M30 66c0-25 15-43 37-43 15 0 28 8 35 21" fill="none" stroke="#005bbb" stroke-width="4" stroke-linecap="round"/>
      <path d="m94 30 10 14-17 4" fill="none" stroke="#005bbb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="67" r="7" fill="#006570"/>
      <text x="119" y="43" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Learning</text>
      <text x="119" y="66" fill="#071b35" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">feedback</text>
      <text x="119" y="88" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="13">human · online</text>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle cx="447" cy="340" r="7" fill="#006570"/>
    <circle cx="474" cy="365" r="5" fill="#2f9fd0"/>
  </g>
  <text x="460" y="632" text-anchor="middle" fill="#4f6078" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">THEORY → ALGORITHMS → RELIABLE SYSTEMS</text>
</svg>
