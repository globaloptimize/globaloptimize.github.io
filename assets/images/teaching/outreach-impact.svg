<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Outreach from real-world questions to mathematical models</title><desc id="desc">Academic research illustration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#005bbb"/><stop offset="1" stop-color="#006570"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071b35" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#005bbb"/></marker>
</defs>
<rect width="1200" height="720" rx="38" fill="url(#bg)"/>
<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Outreach: from “what if?” to mathematical understanding</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Use visible systems—energy, mobility, robots, health, and AI—to make rigorous reasoning accessible.</text><g filter="url(#shadow)"><rect x="100" y="190" width="170" height="195" rx="24" fill="#fff" stroke="#d7e4f2"/><circle cx="185" cy="245" r="28" fill="#2f9fd0" opacity=".18"/><circle cx="185" cy="245" r="12" fill="#2f9fd0"/><text x="185" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">See</text><text x="185" y="345" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">a real system</text></g><path d="M276 285 L292 285" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="300" y="190" width="170" height="195" rx="24" fill="#fff" stroke="#d7e4f2"/><circle cx="385" cy="245" r="28" fill="#a61b34" opacity=".18"/><circle cx="385" cy="245" r="12" fill="#a61b34"/><text x="385" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Ask</text><text x="385" y="345" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">what changes?</text></g><path d="M476 285 L492 285" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="500" y="190" width="170" height="195" rx="24" fill="#fff" stroke="#d7e4f2"/><circle cx="585" cy="245" r="28" fill="#005bbb" opacity=".18"/><circle cx="585" cy="245" r="12" fill="#005bbb"/><text x="585" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Model</text><text x="585" y="345" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">states · actions · costs</text></g><path d="M676 285 L692 285" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="700" y="190" width="170" height="195" rx="24" fill="#fff" stroke="#d7e4f2"/><circle cx="785" cy="245" r="28" fill="#b36b00" opacity=".18"/><circle cx="785" cy="245" r="12" fill="#b36b00"/><text x="785" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Simulate</text><text x="785" y="345" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">compare decisions</text></g><path d="M876 285 L892 285" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="900" y="190" width="170" height="195" rx="24" fill="#fff" stroke="#d7e4f2"/><circle cx="985" cy="245" r="28" fill="#006570" opacity=".18"/><circle cx="985" cy="245" r="12" fill="#006570"/><text x="985" y="310" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Explain</text><text x="985" y="345" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">evidence &amp; tradeoffs</text></g><g><rect x="70" y="470" width="160" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="150.0" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#b36b00">smart grids</text></g><g><rect x="270" y="470" width="160" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="350.0" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#005bbb">autonomous systems</text></g><g><rect x="495" y="470" width="160" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="575.0" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#006570">robots &amp; XR</text></g><g><rect x="710" y="470" width="160" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="790.0" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#a61b34">bio / health</text></g><g><rect x="905" y="470" width="160" height="42" rx="21" fill="#fff" stroke="#cbd8e7"/><text x="985.0" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#2f9fd0">AI &amp; society</text></g><text x="600" y="620" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#071b35">Impact goal: students learn that mathematics is not only calculation—it is a way to understand, design, and improve the world.</text></svg>