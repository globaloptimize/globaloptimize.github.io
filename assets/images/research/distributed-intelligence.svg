<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Distributed &amp; multi-agent intelligence</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Coordinate decisions and learning across agents, network tiers, and local interaction graphs.</text><g filter="url(#shadow)"><rect x="62" y="155" width="520" height="400" rx="28" fill="#fff" stroke="#d7e4f2"/><text x="322" y="202" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#071b35">Cloud → edge → devices</text><path d="M245 260 C245 225 290 212 320 233 C345 203 410 220 410 264 C445 272 450 325 406 334 L250 334 C205 325 204 277 245 260 Z" fill="#e7f2ff" stroke="#005bbb" stroke-width="3"/><text x="330" y="291" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#005bbb">shared model / global evidence</text><rect x="105" y="390" width="90" height="58" rx="12" fill="#eef8fb" stroke="#006570" stroke-width="2"/><line x1="330" y1="335" x2="150" y2="390" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="390" width="90" height="58" rx="12" fill="#eef8fb" stroke="#006570" stroke-width="2"/><line x1="330" y1="335" x2="320" y2="390" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="390" width="90" height="58" rx="12" fill="#eef8fb" stroke="#006570" stroke-width="2"/><line x1="330" y1="335" x2="490" y2="390" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)"/><circle cx="110" cy="500" r="18" fill="#2f9fd0" opacity=".18"/><circle cx="110" cy="500" r="8" fill="#2f9fd0"/><line x1="110" y1="482" x2="150" y2="448" stroke="#006570" stroke-width="2"/><circle cx="190" cy="500" r="18" fill="#2f9fd0" opacity=".18"/><circle cx="190" cy="500" r="8" fill="#2f9fd0"/><line x1="190" y1="482" x2="150" y2="448" stroke="#006570" stroke-width="2"/><circle cx="280" cy="500" r="18" fill="#2f9fd0" opacity=".18"/><circle cx="280" cy="500" r="8" fill="#2f9fd0"/><line x1="280" y1="482" x2="320" y2="448" stroke="#006570" stroke-width="2"/><circle cx="360" cy="500" r="18" fill="#2f9fd0" opacity=".18"/><circle cx="360" cy="500" r="8" fill="#2f9fd0"/><line x1="360" y1="482" x2="320" y2="448" stroke="#006570" stroke-width="2"/><circle cx="450" cy="500" r="18" fill="#2f9fd0" opacity=".18"/><circle cx="450" cy="500" r="8" fill="#2f9fd0"/><line x1="450" y1="482" x2="490" y2="448" stroke="#006570" stroke-width="2"/><circle cx="530" cy="500" r="18" fill="#2f9fd0" opacity=".18"/><circle cx="530" cy="500" r="8" fill="#2f9fd0"/><line x1="530" y1="482" x2="490" y2="448" stroke="#006570" stroke-width="2"/></g><g filter="url(#shadow)"><rect x="630" y="155" width="500" height="130" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="630" y="155" width="8" height="130" rx="4" fill="#005bbb"/><text x="658" y="197" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Local structure, global behavior</text><text x="658" y="233" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="658" dy="0">factor graphs · communication-compatible protocols</tspan><tspan x="658" dy="22.44">experience sharing · model partitioning · task coupling</tspan></text></g><g filter="url(#shadow)"><rect x="630" y="325" width="235" height="175" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="630" y="325" width="8" height="175" rx="4" fill="#006570"/><text x="658" y="367" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Coordinate</text><text x="658" y="403" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="658" dy="0">centralized training</tspan><tspan x="658" dy="22.44">decentralized execution</tspan><tspan x="658" dy="22.44">message passing</tspan><tspan x="658" dy="22.44">shared constraints</tspan></text></g><g filter="url(#shadow)"><rect x="895" y="325" width="235" height="175" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="895" y="325" width="8" height="175" rx="4" fill="#b36b00"/><text x="923" y="367" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Allocate</text><text x="923" y="403" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="923" dy="0">communication</tspan><tspan x="923" dy="22.44">compute &amp; memory</tspan><tspan x="923" dy="22.44">which model parts</tspan><tspan x="923" dy="22.44">when / where to update</tspan></text></g><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#071b35">Applications: robot teams · wireless networks · cloud/edge/device AI · cooperative sensing</text></svg>