<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Computer networks teaching illustration</title><desc id="desc">Academic research illustration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#005bbb"/><stop offset="1" stop-color="#006570"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071b35" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#005bbb"/></marker>
</defs>
<rect width="1200" height="720" rx="38" fill="url(#bg)"/>
<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Computer Networks</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Protocols, queues, routing, congestion, wireless systems, and the intelligence that controls them.</text><g filter="url(#shadow)"><rect x="65" y="155" width="520" height="390" rx="28" fill="#fff" stroke="#d7e4f2"/><line x1="145" y1="255" x2="315" y2="215" stroke="#b7cbe0" stroke-width="3"/><line x1="145" y1="255" x2="185" y2="430" stroke="#b7cbe0" stroke-width="3"/><line x1="145" y1="255" x2="350" y2="390" stroke="#b7cbe0" stroke-width="3"/><line x1="315" y1="215" x2="485" y2="270" stroke="#b7cbe0" stroke-width="3"/><line x1="315" y1="215" x2="185" y2="430" stroke="#b7cbe0" stroke-width="3"/><line x1="315" y1="215" x2="350" y2="390" stroke="#b7cbe0" stroke-width="3"/><line x1="485" y1="270" x2="350" y2="390" stroke="#b7cbe0" stroke-width="3"/><line x1="485" y1="270" x2="500" y2="455" stroke="#b7cbe0" stroke-width="3"/><line x1="185" y1="430" x2="350" y2="390" stroke="#b7cbe0" stroke-width="3"/><line x1="350" y1="390" x2="500" y2="455" stroke="#b7cbe0" stroke-width="3"/><circle cx="145" cy="255" r="31" fill="#005bbb" opacity=".16"/><circle cx="145" cy="255" r="14" fill="#005bbb"/><circle cx="315" cy="215" r="31" fill="#006570" opacity=".16"/><circle cx="315" cy="215" r="14" fill="#006570"/><circle cx="485" cy="270" r="31" fill="#2f9fd0" opacity=".16"/><circle cx="485" cy="270" r="14" fill="#2f9fd0"/><circle cx="185" cy="430" r="31" fill="#b36b00" opacity=".16"/><circle cx="185" cy="430" r="14" fill="#b36b00"/><circle cx="350" cy="390" r="31" fill="#087f5b" opacity=".16"/><circle cx="350" cy="390" r="14" fill="#087f5b"/><circle cx="500" cy="455" r="31" fill="#a61b34" opacity=".16"/><circle cx="500" cy="455" r="14" fill="#a61b34"/><path d="M145 255 C250 270 275 225 315 215 C390 205 415 255 485 270" fill="none" stroke="#005bbb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/></g><g filter="url(#shadow)"><rect x="630" y="155" width="500" height="125" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="630" y="155" width="8" height="125" rx="4" fill="#005bbb"/><text x="658" y="197" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">From packets to decisions</text><text x="658" y="233" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="658" dy="0">network stack and protocols → queueing and routing → learning-enabled control</tspan><tspan x="658" dy="22.44">measure performance, model uncertainty, and design resource allocation</tspan></text></g><g filter="url(#shadow)"><rect x="630" y="320" width="235" height="190" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="630" y="320" width="8" height="190" rx="4" fill="#2f9fd0"/><text x="658" y="362" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Core systems</text><text x="658" y="398" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="658" dy="0">TCP/IP and routing</tspan><tspan x="658" dy="22.44">wireless and mobility</tspan><tspan x="658" dy="22.44">queues and congestion</tspan><tspan x="658" dy="22.44">security and reliability</tspan></text></g><g filter="url(#shadow)"><rect x="895" y="320" width="235" height="190" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="895" y="320" width="8" height="190" rx="4" fill="#006570"/><text x="923" y="362" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Research bridge</text><text x="923" y="398" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="923" dy="0">data-center scheduling</tspan><tspan x="923" dy="22.44">edge AI systems</tspan><tspan x="923" dy="22.44">multi-agent control</tspan><tspan x="923" dy="22.44">Age of Intelligence</tspan></text></g><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#071b35">Course: EE 434/534 · University at Buffalo · Spring 2026</text></svg>