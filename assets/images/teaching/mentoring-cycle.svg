<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Research mentoring as a complete learning cycle</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Students move from a consequential question to a rigorous result and clear public communication.</text><g filter="url(#shadow)"><circle cx="160" cy="340" r="88" fill="#fff" stroke="#d7e4f2"/><circle cx="160" cy="316" r="16" fill="#a61b34" opacity=".18"/><circle cx="160" cy="316" r="8" fill="#a61b34"/><text x="160" y="352" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#071b35">Ask</text><text x="160" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">problem &amp; impact</text></g><g filter="url(#shadow)"><circle cx="370" cy="205" r="88" fill="#fff" stroke="#d7e4f2"/><circle cx="370" cy="181" r="16" fill="#005bbb" opacity=".18"/><circle cx="370" cy="181" r="8" fill="#005bbb"/><text x="370" y="217" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#071b35">Model</text><text x="370" y="247" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">assumptions &amp; abstraction</text></g><g filter="url(#shadow)"><circle cx="615" cy="205" r="88" fill="#fff" stroke="#d7e4f2"/><circle cx="615" cy="181" r="16" fill="#006570" opacity=".18"/><circle cx="615" cy="181" r="8" fill="#006570"/><text x="615" y="217" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#071b35">Analyze</text><text x="615" y="247" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">theorem &amp; limits</text></g><g filter="url(#shadow)"><circle cx="840" cy="340" r="88" fill="#fff" stroke="#d7e4f2"/><circle cx="840" cy="316" r="16" fill="#b36b00" opacity=".18"/><circle cx="840" cy="316" r="8" fill="#b36b00"/><text x="840" y="352" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#071b35">Test</text><text x="840" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">simulation &amp; systems</text></g><g filter="url(#shadow)"><circle cx="615" cy="500" r="88" fill="#fff" stroke="#d7e4f2"/><circle cx="615" cy="476" r="16" fill="#2f9fd0" opacity=".18"/><circle cx="615" cy="476" r="8" fill="#2f9fd0"/><text x="615" y="512" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#071b35">Communicate</text><text x="615" y="542" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">paper · talk · demo</text></g><g filter="url(#shadow)"><circle cx="370" cy="500" r="88" fill="#fff" stroke="#d7e4f2"/><circle cx="370" cy="476" r="16" fill="#087f5b" opacity=".18"/><circle cx="370" cy="476" r="8" fill="#087f5b"/><text x="370" y="512" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="850" fill="#071b35">Reflect</text><text x="370" y="542" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#4f6078">revise &amp; generalize</text></g><path d="M230 340 C265.0 340 265.0 205 300 205" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".65"/><path d="M440 205 C492.5 205 492.5 205 545 205" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".65"/><path d="M685 205 C727.5 205 727.5 340 770 340" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".65"/><path d="M770 340 C727.5 340 727.5 500 685 500" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".65"/><path d="M545 500 C492.5 500 492.5 500 440 500" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".65"/><path d="M300 500 C265.0 500 265.0 340 230 340" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".65"/><circle cx="505" cy="350" r="95" fill="url(#g1)"/><text x="505" y="325" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff"><tspan x="505" dy="0">Student ownership</tspan><tspan x="505" dy="26.25">with calibrated</tspan><tspan x="505" dy="26.25">faculty support</tspan></text><text x="600" y="660" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#071b35">Theory ↔ algorithms ↔ systems ↔ communication</text></svg>