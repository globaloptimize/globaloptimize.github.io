<text x="62" y="66" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850" fill="#071b35">Dynamic, secure &amp; robust AI</text><text x="62" y="102" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="550" fill="#4f6078">Remain useful as models, environments, threats, and feedback sources change over time.</text><g filter="url(#shadow)"><rect x="65" y="155" width="555" height="385" rx="28" fill="#fff" stroke="#d7e4f2"/><text x="342" y="202" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#071b35">Drift, attacks, and model staleness</text><path d="M105 410 C170 390 200 250 270 310 C330 360 360 205 430 255 C485 295 515 180 580 230" fill="none" stroke="#2f9fd0" stroke-width="6"/><path d="M105 445 C190 435 245 420 315 380 C390 340 470 350 580 310" fill="none" stroke="#005bbb" stroke-width="7"/><circle cx="270" cy="310" r="13" fill="#a61b34"/><line x1="270" y1="220" x2="270" y2="480" stroke="#a61b34" stroke-width="2" stroke-dasharray="8 8" opacity=".45"/><circle cx="430" cy="255" r="13" fill="#a61b34"/><line x1="430" y1="220" x2="430" y2="480" stroke="#a61b34" stroke-width="2" stroke-dasharray="8 8" opacity=".45"/><circle cx="580" cy="230" r="13" fill="#a61b34"/><line x1="580" y1="220" x2="580" y2="480" stroke="#a61b34" stroke-width="2" stroke-dasharray="8 8" opacity=".45"/><g><rect x="105" y="475" width="150" height="42" rx="21" fill="#eef6ff" stroke="#b5d0ec"/><text x="180.0" y="502" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#005bbb">cached model</text></g><g><rect x="275" y="475" width="145" height="42" rx="21" fill="#fff7e9" stroke="#edcc95"/><text x="347.5" y="502" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#b36b00">refresh?</text></g><g><rect x="440" y="475" width="140" height="42" rx="21" fill="#fff1f4" stroke="#efbac6"/><text x="510.0" y="502" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#a61b34">defend?</text></g></g><g filter="url(#shadow)"><rect x="665" y="155" width="465" height="125" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="665" y="155" width="8" height="125" rx="4" fill="#2f9fd0"/><text x="693" y="197" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Detect consequential change</text><text x="693" y="233" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="693" dy="0">Age of Intelligence · predictive divergence · regime tests</tspan><tspan x="693" dy="22.44">distinguish harmless motion from decision-changing drift</tspan></text></g><g filter="url(#shadow)"><rect x="665" y="320" width="220" height="190" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="665" y="320" width="8" height="190" rx="4" fill="#b36b00"/><text x="693" y="362" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Respond</text><text x="693" y="398" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="693" dy="0">refresh / retain</tspan><tspan x="693" dy="22.44">robust policy</tspan><tspan x="693" dy="22.44">risk-priority defense</tspan><tspan x="693" dy="22.44">fallback behavior</tspan></text></g><g filter="url(#shadow)"><rect x="910" y="320" width="220" height="190" rx="24" fill="#fff" stroke="#d7e4f2"/><rect x="910" y="320" width="8" height="190" rx="4" fill="#087f5b"/><text x="938" y="362" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#071b35">Guarantee</text><text x="938" y="398" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#4f6078"><tspan x="938" dy="0">minimax regret</tspan><tspan x="938" dy="22.44">pathwise tradeoffs</tspan><tspan x="938" dy="22.44">robustness limits</tspan><tspan x="938" dy="22.44">security queues</tspan></text></g><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#071b35">Applications: dynamic IoT · cyber defense · LLM security · nonstationary RL · generative AI</text></svg>