<text x="70" y="74" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="850" fill="#071b35">Reliable networked intelligence</text><text x="70" y="110" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="550" fill="#4f6078">One agenda: learn what matters, act safely, adapt economically, and coordinate across systems.</text><g filter="url(#shadow)"><rect x="70" y="190" width="170" height="150" rx="25" fill="#fff" stroke="#d7e4f2"/><circle cx="105" cy="225" r="16" fill="#2f9fd0" opacity=".18"/><circle cx="105" cy="225" r="8" fill="#2f9fd0"/><text x="94" y="270" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Observe</text><text x="94" y="300" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">partial states</text><text x="94" y="324" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">preferences &amp; forecasts</text></g><path d="M246 265 C263 265 277 265 291 265" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".75"/><g filter="url(#shadow)"><rect x="295" y="190" width="170" height="150" rx="25" fill="#fff" stroke="#d7e4f2"/><circle cx="330" cy="225" r="16" fill="#006570" opacity=".18"/><circle cx="330" cy="225" r="8" fill="#006570"/><text x="319" y="270" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Certify</text><text x="319" y="300" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">confidence sets</text><text x="319" y="324" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">viability &amp; sharing</text></g><path d="M471 265 C488 265 502 265 516 265" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".75"/><g filter="url(#shadow)"><rect x="520" y="190" width="170" height="150" rx="25" fill="#fff" stroke="#d7e4f2"/><circle cx="555" cy="225" r="16" fill="#005bbb" opacity=".18"/><circle cx="555" cy="225" r="8" fill="#005bbb"/><text x="544" y="270" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Decide</text><text x="544" y="300" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">RL · OCO · bandits</text><text x="544" y="324" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">multi-agent control</text></g><path d="M696 265 C713 265 727 265 741 265" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".75"/><g filter="url(#shadow)"><rect x="745" y="190" width="170" height="150" rx="25" fill="#fff" stroke="#d7e4f2"/><circle cx="780" cy="225" r="16" fill="#b36b00" opacity=".18"/><circle cx="780" cy="225" r="8" fill="#b36b00"/><text x="769" y="270" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Guarantee</text><text x="769" y="300" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">zero violation</text><text x="769" y="324" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">regret · competitive ratio</text></g><path d="M921 265 C938 265 952 265 966 265" fill="none" stroke="#005bbb" stroke-width="3" marker-end="url(#arrow)" opacity=".75"/><g filter="url(#shadow)"><rect x="970" y="190" width="170" height="150" rx="25" fill="#fff" stroke="#d7e4f2"/><circle cx="1005" cy="225" r="16" fill="#087f5b" opacity=".18"/><circle cx="1005" cy="225" r="8" fill="#087f5b"/><text x="994" y="270" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Deploy</text><text x="994" y="300" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">robots · networks</text><text x="994" y="324" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#4f6078">edge AI · security</text></g><text x="70" y="405" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="850" fill="#071b35">Five mutually reinforcing research directions</text><g><rect x="70" y="440" width="190" height="112" rx="20" fill="#fff" stroke="#d7e4f2"/><rect x="70" y="440" width="190" height="8" rx="4" fill="#a61b34"/><text x="88" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#071b35"><tspan x="88" dy="0">Safe &amp; verifiable</tspan><tspan x="88" dy="20.74">learning</tspan></text></g><g><rect x="292" y="440" width="190" height="112" rx="20" fill="#fff" stroke="#d7e4f2"/><rect x="292" y="440" width="190" height="8" rx="4" fill="#b36b00"/><text x="310" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#071b35"><tspan x="310" dy="0">Prediction &amp;</tspan><tspan x="310" dy="20.74">costly adaptation</tspan></text></g><g><rect x="548" y="440" width="190" height="112" rx="20" fill="#fff" stroke="#d7e4f2"/><rect x="548" y="440" width="190" height="8" rx="4" fill="#2f9fd0"/><text x="566" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#071b35"><tspan x="566" dy="0">Partial &amp; human</tspan><tspan x="566" dy="20.74">information</tspan></text></g><g><rect x="790" y="440" width="190" height="112" rx="20" fill="#fff" stroke="#d7e4f2"/><rect x="790" y="440" width="190" height="8" rx="4" fill="#005bbb"/><text x="808" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#071b35"><tspan x="808" dy="0">Distributed &amp;</tspan><tspan x="808" dy="20.74">multi-agent</tspan></text></g><g><rect x="1005" y="440" width="160" height="112" rx="20" fill="#fff" stroke="#d7e4f2"/><rect x="1005" y="440" width="160" height="8" rx="4" fill="#006570"/><text x="1023" y="480" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#071b35"><tspan x="1023" dy="0">Dynamic, secure &amp;</tspan><tspan x="1023" dy="20.74">robust AI</tspan></text></g><rect x="70" y="610" width="1060" height="58" rx="29" fill="url(#g1)" opacity=".96"/><text x="600" y="647" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#fff">Mathematical foundations: information limits · confidence and concentration · dynamic regret · competitive analysis · lower bounds</text></svg>